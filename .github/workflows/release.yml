name: Build release installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-source-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux/Zorin test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libadwaita-1-0 \
            python3-pil python3-pil.imagetk python3-av python3-certifi \
            python3-keyring python3-secretstorage python3-zeroconf python3-pystray \
            python3-tk wl-clipboard xclip xvfb pkexec openssh-client \
            gir1.2-vte-3.91 libvte-2.91-gtk4-0 rsync
      - name: Verify tag, release source and tests
        run: |
          set -euo pipefail
          /usr/bin/python3 -m compileall -q .
          scripts/run-tests.sh
          scripts/verify-release-source.sh

  macos-native-gate:
    needs: [release-source-check]
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify native macOS dylib
        run: |
          set -euo pipefail
          scripts/verify-macos-native-gate.sh

  linux-amd64:
    needs: [release-source-check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native Zorin/GNOME test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libadwaita-1-0 \
            python3-pil python3-pil.imagetk python3-av python3-certifi \
            python3-keyring python3-secretstorage python3-zeroconf python3-pystray \
            python3-tk wl-clipboard xclip xvfb pkexec openssh-client \
            gir1.2-vte-3.91 libvte-2.91-gtk4-0 rsync
      - name: Run Linux tests
        run: |
          /usr/bin/python3 -m compileall -q .
          scripts/run-tests.sh
          /usr/bin/python3 -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); gi.require_version('Vte','3.91'); from gi.repository import Gtk, Adw, Vte; import av; av.CodecContext.create('h264','r'); import keyring; print('GTK4/libadwaita/VTE + H.264 runtime OK')"
          bash -n install-linux.sh
          bash -n native/macos/admin/install-admin.sh
          bash -n native/macos/admin/uninstall-admin.sh
          bash -n native/macos/admin/zmb-admin
          bash -n native/macos/admin/zmb-admin-ssh
          bash -n native/macos/admin/zmb-system-daemon
      - name: Build native Zorin/Ubuntu DEB
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="$(cat VERSION)"; fi

          PKG="build/deb"
          APP="$PKG/usr/lib/zorinmacbridge"
          mkdir -p "$PKG/DEBIAN" "$APP/assets" \
                   "$PKG/usr/bin" \
                   "$PKG/usr/share/applications" \
                   "$PKG/usr/share/icons/hicolor/256x256/apps"

          chmod 0755 "$PKG/DEBIAN"
          chmod g-s "$PKG/DEBIAN"  # clear inherited setgid on unusual build filesystems
          install -m 0644 linux_client_gtk.py linux_client.py protocol.py discovery.py resources.py \
            tray_icon.py updates.py settings.py secret_store.py zmb_admin_backend.py zmb_pairing_state.py zmb_system_page.py zmb_xcode_page.py zmb_xcode_data.py zmb_shell_backend.py zmb_terminal_page.py zmb_project_data.py zmb_projects_page.py zmb_sync_backend.py zmb_video_policy.py zmb_recovery.py zmb_shutdown.py zmb_session_lifecycle.py zmb_client_runtime.py "$APP/"
          install -m 0644 VERSION "$APP/VERSION"
          install -m 0644 assets/client.png "$APP/assets/client.png"

          # Import the client from the exact staged package tree before building the DEB.
          # This catches missing local modules such as the 0.14.15 zmb_shutdown.py regression.
          PYTHONPATH="$APP" /usr/bin/python3 -c "import linux_client_gtk; print('staged Linux client import OK')"

          cat > "$PKG/usr/bin/zorinmacbridge" <<'EOF'
          #!/bin/sh
          exec /usr/bin/python3 /usr/lib/zorinmacbridge/linux_client_gtk.py "$@"
          EOF
          chmod 0755 "$PKG/usr/bin/zorinmacbridge"

          install -m 0644 packaging/linux/zorinmacbridge.desktop "$PKG/usr/share/applications/zorinmacbridge.desktop"
          /usr/bin/python3 - <<'PYPNG'
          from PIL import Image
          Image.open('assets/client.png').convert('RGBA').resize((256,256), Image.Resampling.LANCZOS).save('build/client-256.png')
          PYPNG
          install -m 0644 build/client-256.png "$PKG/usr/share/icons/hicolor/256x256/apps/zorinmacbridge.png"

          cat > "$PKG/DEBIAN/control" <<CTRL
          Package: zorinmacbridge
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: ILoveMyProjects
          Depends: python3 (>= 3.12), python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1, libadwaita-1-0, gir1.2-vte-3.91, libvte-2.91-gtk4-0, python3-pil, python3-pil.imagetk, python3-av, python3-certifi, python3-keyring, python3-secretstorage, python3-zeroconf, python3-pystray, python3-tk, wl-clipboard, xclip, pkexec, openssh-client, rsync
          Description: Native GTK4/libadwaita LAN client for ZorinMacBridge
           Remote macOS desktop, keyboard/mouse, clipboard, shared-folder transfer,
           unattended recovery, layered P6 diagnostics, P7 required-setup health, Xcode controls, user SSH terminal, project actions, safe project sync, and adaptive low-latency H.264 streaming
           with a Zorin/GNOME-native interface.
          CTRL

          mkdir -p release
          dpkg-deb --root-owner-group --build "$PKG" "release/ZorinMacBridge-Client_linux-amd64.deb"
          (cd release && sha256sum * > SHA256SUMS-linux.txt)
      - name: Verify DEB layout
        run: |
          set -euo pipefail
          dpkg-deb --info release/ZorinMacBridge-Client_linux-amd64.deb
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/linux_client_gtk.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/share/applications/zorinmacbridge.desktop'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_admin_backend.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_pairing_state.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_system_page.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_xcode_page.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_xcode_data.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_shell_backend.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_terminal_page.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_project_data.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_projects_page.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_sync_backend.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_video_policy.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_recovery.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_shutdown.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_session_lifecycle.py'
          dpkg-deb --contents release/ZorinMacBridge-Client_linux-amd64.deb | grep -F 'usr/lib/zorinmacbridge/zmb_client_runtime.py'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: release/*

  macos-arm64:
    needs: [release-source-check, macos-native-gate]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify macOS signing scripts
        run: |
          set -euo pipefail
          bash -n scripts/sign-macos-release.sh
          python3 -m py_compile mac_release_signing.py
      - name: Verify macOS Project Sync dependency
        run: |
          set -euo pipefail
          test -x /usr/bin/rsync
          /usr/bin/rsync --version | head -n 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller Pillow==12.3.0 cryptography==50.0.1 certifi 'zeroconf>=0.147,<1' 'pystray>=0.19.5,<1'
      - name: Configure optional Developer ID signing
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          present=0
          [ -n "${MACOS_DEVELOPER_ID_P12_BASE64:-}" ] && present=$((present + 1))
          [ -n "${MACOS_DEVELOPER_ID_P12_PASSWORD:-}" ] && present=$((present + 1))
          [ -n "${MACOS_DEVELOPER_ID_PROFILE_BASE64:-}" ] && present=$((present + 1))
          if [ "$present" -eq 0 ]; then
            echo 'Apple Developer credentials not configured; using free ad-hoc transport signing.'
            echo 'MACOS_RELEASE_SIGNING_MODE=adhoc' >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$present" -ne 3 ]; then
            echo 'Optional Developer ID signing is partially configured. Set all three MACOS_DEVELOPER_ID_* secrets or none of them.' >&2
            exit 1
          fi
          mkdir -p build/signing
          python3 - <<'PYSECRETS'
          import base64, os, pathlib
          pathlib.Path('build/signing/developer-id.p12').write_bytes(base64.b64decode(os.environ['MACOS_DEVELOPER_ID_P12_BASE64']))
          pathlib.Path('build/signing/ZorinMacBridge.provisionprofile').write_bytes(base64.b64decode(os.environ['MACOS_DEVELOPER_ID_PROFILE_BASE64']))
          PYSECRETS
          KEYCHAIN_PATH="$RUNNER_TEMP/zmb-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)-$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import build/signing/developer-id.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          MACOS_CODESIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application:/ {print $2; exit}')"
          test -n "$MACOS_CODESIGN_IDENTITY" || { echo 'No Developer ID Application identity was imported.' >&2; exit 1; }
          MACOS_CODESIGN_SHA1="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -v needle="$MACOS_CODESIGN_IDENTITY" 'index($0, "\"" needle "\"") {print $2; exit}')"
          python3 mac_release_signing.py --verify-profile build/signing/ZorinMacBridge.provisionprofile "$MACOS_CODESIGN_SHA1"
          echo "MACOS_RELEASE_SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
          echo "MACOS_CODESIGN_IDENTITY=$MACOS_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_CODESIGN_SHA1=$MACOS_CODESIGN_SHA1" >> "$GITHUB_ENV"
          echo "MACOS_PROVISIONING_PROFILE=$GITHUB_WORKSPACE/build/signing/ZorinMacBridge.provisionprofile" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Build macOS Apple Silicon server
        run: |
          scripts/verify-macos-native-gate.sh

          mkdir -p build/AppIcon.iconset
          sips -z 16 16 assets/server.png --out build/AppIcon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/server.png --out build/AppIcon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/server.png --out build/AppIcon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/server.png --out build/AppIcon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/server.png --out build/AppIcon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/server.png --out build/AppIcon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/server.png --out build/AppIcon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/server.png --out build/AppIcon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/server.png --out build/AppIcon.iconset/icon_512x512.png >/dev/null
          cp assets/server.png build/AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns build/AppIcon.iconset -o build/server.icns

          PYINSTALLER_SIGN_ARGS=()
          if [ "${MACOS_RELEASE_SIGNING_MODE:-adhoc}" = "developer-id" ]; then
            PYINSTALLER_SIGN_ARGS=(--codesign-identity "$MACOS_CODESIGN_IDENTITY")
          fi
          pyinstaller --noconfirm --clean --windowed \
            "${PYINSTALLER_SIGN_ARGS[@]}" \
            --name 'ZorinMacBridge Server' \
            --osx-bundle-identifier com.ilovemyprojects.zorinmacbridge.server \
            --icon build/server.icns \
            --add-data 'assets/server.png:assets' \
            --add-data 'VERSION:.' \
            --add-data 'native/macos/admin:native/macos/admin' \
            --add-binary 'build/libzmb_streamer.dylib:.' \
            --add-binary 'build/libzmb_capability_probe.dylib:.' \
            --collect-all cryptography \
            --collect-all certifi \
            --collect-all zeroconf \
            --collect-all pystray \
            --hidden-import pystray._darwin \
            --hidden-import mac_terminal_setup \
            --hidden-import mac_release_signing \
            mac_server_gui.py

          /usr/libexec/PlistBuddy -c "Add :NSScreenCaptureUsageDescription string ZorinMacBridge streams this Mac display only to an authenticated LAN client." 'dist/ZorinMacBridge Server.app/Contents/Info.plist' || true
          APP_VERSION="$(cat VERSION)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" 'dist/ZorinMacBridge Server.app/Contents/Info.plist' 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" 'dist/ZorinMacBridge Server.app/Contents/Info.plist'
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_VERSION" 'dist/ZorinMacBridge Server.app/Contents/Info.plist' 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $APP_VERSION" 'dist/ZorinMacBridge Server.app/Contents/Info.plist'
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 26.0" 'dist/ZorinMacBridge Server.app/Contents/Info.plist' 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 26.0" 'dist/ZorinMacBridge Server.app/Contents/Info.plist'
          if [ "${MACOS_RELEASE_SIGNING_MODE:-adhoc}" = "developer-id" ]; then
            echo '=== macOS phase: optional Developer ID + provisioning signing ==='
            scripts/sign-macos-release.sh \
              'dist/ZorinMacBridge Server.app' \
              "$MACOS_PROVISIONING_PROFILE" \
              "$MACOS_CODESIGN_IDENTITY"
          else
            echo '=== macOS phase: free ad-hoc transport signing ==='
            scripts/sign-macos-transport.sh 'dist/ZorinMacBridge Server.app'
          fi
          echo '=== macOS phase: frozen-app self tests ==='
          'dist/ZorinMacBridge Server.app/Contents/MacOS/ZorinMacBridge Server' --self-test-streamer-load
          'dist/ZorinMacBridge Server.app/Contents/MacOS/ZorinMacBridge Server' --self-test-capability-probe-load
          'dist/ZorinMacBridge Server.app/Contents/MacOS/ZorinMacBridge Server' --self-test-update-tls
          'dist/ZorinMacBridge Server.app/Contents/MacOS/ZorinMacBridge Server' --self-test-permission-apis
          if [ "${MACOS_RELEASE_SIGNING_MODE:-adhoc}" = "developer-id" ]; then
            'dist/ZorinMacBridge Server.app/Contents/MacOS/ZorinMacBridge Server' --verify-release-app 'dist/ZorinMacBridge Server.app'
          else
            codesign --verify --deep --strict --verbose=2 'dist/ZorinMacBridge Server.app'
          fi
          mkdir -p release build/dmgroot
          cp -R 'dist/ZorinMacBridge Server.app' build/dmgroot/
          ln -s /Applications build/dmgroot/Applications
          hdiutil create -volname 'ZorinMacBridge Server' \
            -srcfolder build/dmgroot \
            -ov -format UDZO 'release/ZorinMacBridge-Server_macOS-arm64.dmg'
          (cd release && shasum -a 256 * > SHA256SUMS-macOS-arm64.txt)
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-amd64, macos-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZorinMacBridge $GITHUB_REF_NAME" \
            --generate-notes
