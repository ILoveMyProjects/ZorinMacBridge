name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux/Zorin runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libadwaita-1-0 \
            python3-pil python3-pil.imagetk python3-av python3-certifi \
            python3-keyring python3-secretstorage python3-zeroconf python3-pystray \
            python3-tk wl-clipboard xclip xvfb pkexec openssh-client \
            gir1.2-vte-3.91 libvte-2.91-gtk4-0 rsync
      - name: Syntax and protocol tests
        run: |
          /usr/bin/python3 -m compileall -q .
          /usr/bin/python3 test_protocol.py
          /usr/bin/python3 test_support.py
          /usr/bin/python3 test_updater.py
          /usr/bin/python3 test_native_ui.py
          /usr/bin/python3 test_local_signing.py
          /usr/bin/python3 test_p0_admin.py
          /usr/bin/python3 test_xcode.py
          /usr/bin/python3 test_p3.py
          /usr/bin/python3 test_p4.py
          /usr/bin/python3 test_p5.py
          /usr/bin/python3 test_p6.py
          /usr/bin/python3 -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); gi.require_version('Vte','3.91'); from gi.repository import Gtk, Adw, Vte; import av; av.CodecContext.create('h264','r'); import keyring; print('GTK4/libadwaita/VTE + H.264 runtime OK')"
          bash -n install-linux.sh
          bash -n install-macos.sh
          bash -n native/macos/admin/install-admin.sh
          bash -n native/macos/admin/uninstall-admin.sh
          bash -n native/macos/admin/zmb-admin
          bash -n native/macos/admin/zmb-admin-ssh
          bash -n native/macos/admin/zmb-system-daemon
          bash -n scripts/verify-release-source.sh
          scripts/verify-release-source.sh
